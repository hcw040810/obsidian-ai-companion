services:
  - type: web
    name: obsidian-ai-companion
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: MIMO_API_KEY
        sync: false
      - key: MIMO_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com/v1
      - key: MIMO_MODEL
        value: mimo-v2.5-pro
      - key: PYTHON_VERSION
        value: 3.11.0
